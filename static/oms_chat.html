<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMS 챗봇 — 주류도매 주문 응답</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --border: #d9dde3; --text: #1c2128;
    --muted: #6b7280; --accent: #4f46e5; --accent-soft: #eef2ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { margin: 0; font-size: 17px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; max-width: 82ch; }
  main { max-width: 820px; margin: 0 auto; padding: 24px; }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-bottom: 20px;
  }
  .note {
    font-size: 13px; color: var(--muted); background: var(--accent-soft);
    border-radius: 8px; padding: 10px 12px; margin-bottom: 14px;
  }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  button {
    font: inherit; border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 12px; background: #fff; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary {
    background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600;
  }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }
  form#composer { display: flex; gap: 8px; align-items: center; }
  input[type="range"] { accent-color: var(--accent); }
  #oms-delay-value { color: var(--accent); font-weight: 600; }
  input[type="text"] {
    flex: 1; border: 1px solid var(--border); border-radius: 6px;
    padding: 9px 10px; font: inherit;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  #status { color: var(--muted); font-size: 12px; min-height: 18px; margin-top: 8px; }
  #warning {
    margin-top: 8px; border-radius: 6px; padding: 7px 9px;
    background: #fffbeb; color: #92400e; font-size: 12px;
  }
  #log { min-height: 280px; max-height: 56vh; overflow-y: auto; }
  .turn { border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .turn .who {
    font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin-bottom: 6px;
  }
  .turn .text { white-space: pre-wrap; word-break: break-word; }
  .turn .answer {
    margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border);
    white-space: pre-wrap; word-break: break-word;
  }
</style>
</head>
<body>
<header>
  <h1>OMS 챗봇 — 주류도매 주문 응답</h1>
  <p>
    채팅 모델의 첫 토큰은 느리지만, VDS 서브패스는 발화를 빠르게 분류합니다. 의도가
    나오는 대로 짧은 추임새를 먼저 보여주고, LLM 답변이 준비되면 그 아래에 이어서
    붙입니다. <a href="/">← back to the main UI</a>
  </p>
</header>

<main>
  <div class="note">
    이 예제는 지연 가리기 UX 시연입니다. <code>oms</code> 헤드는 주류도매 카카오톡
    메시지를 <strong>주문 / 조회 / 질문</strong>으로 분류합니다. LLM 답변에 나오는
    가격은 데모용 예시이며 실제 재고나 실시간 판매 조건이 아닙니다.
  </div>

  <div class="panel">
    <div class="examples">
      <button type="button" data-example="참이슬 2박스 보내주세요">참이슬 2박스</button>
      <button type="button" data-example="어제 주문 배송 언제 오나요?">어제 주문 배송</button>
    </div>
    <div class="row">
      <label class="ctl" for="oms-delay">OMS 시작 지연 <span id="oms-delay-value">150ms</span></label>
      <input id="oms-delay" type="range" min="50" max="500" step="50" value="150">
    </div>
    <form id="composer">
      <input id="message" type="text" autocomplete="off" placeholder="주문·조회·가격 문의를 입력하세요">
      <button class="primary" type="submit">보내기</button>
    </form>
    <div id="status" aria-live="polite"></div>
    <div id="warning" aria-live="polite" hidden></div>
  </div>

  <div class="panel">
    <div id="log" aria-live="polite"></div>
  </div>
</main>

<script type="module" src="/oms_chat.js"></script>
</body>
</html>
